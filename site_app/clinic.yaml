assistant:
  page_title: "AI assistant"
  page_lede: >-
    A digital receptionist for this clinic. It answers general questions about the practice, and -
    once you have signed in - questions about your own visits, appointments and invoices.
  # the assistant opens the conversation itself, so the page is never a
  # blank form waiting to be filled
  greeting: "Hi — how can I help you today?"
  greeting_hint: "Ask about our hours, where we are, what we treat, or how booking works."
  starters:
    - "What are your opening hours?"
    - "Where are you?"
    - "What treatments do you offer?"
    - "How do I book an appointment?"
  thinking_label: "Checking the clinic information"
  listening_label: "Listening"
  speaking_label: "Speaking"
  voice_start_label: "Start voice conversation"
  voice_stop_label: "Stop"
  voice_off_note: "Voice is switched off on this server."
  mic_denied_note: "Microphone access was refused, so voice is unavailable. You can still type."
  mic_unavailable_note: >-
    No microphone was available, so voice is off. It may be missing, or another application may
    be holding it. You can still type.
  autoplay_blocked_note: >-
    Your browser keeps sound off until you interact with the page. Click anywhere to turn it on -
    the assistant is still listening, and its answer is above.
  input_placeholder: "Ask about the clinic"
  send_label: "Send"
  capability_heading: "What it can do today"
  can:
    - "Answer questions about this clinic: opening hours, where we are, what we treat, our dentists"
    - "Explain how booking works and how signing in to your own records works"
    - "Say plainly when a question is outside what it knows, rather than guessing"
    - "Take your question by voice and answer out loud, when voice is switched on"
  cannot_heading: "What it cannot do yet"
  cannot:
    - "See any patient records - this page holds none. Sign in and the assistant answers from yours"
    - "Book, move or cancel an appointment - those are arranged with the clinic by phone"
    - "Remember this conversation. Reload the page and it starts fresh"
  heading: "How the assistant works"
  body: >-
    A digital receptionist that answers questions about the clinic, and - once you have signed in -
    about your own records.
  steps:
    - {n: "1", title: "Start a conversation", body: "Open the assistant from any page."}
    - {n: "2", title: "Say what you need", body: "In your own words, in Italian or English."}
    - {n: "3", title: "It checks your records", body: "Only after you have signed in and been verified."}
    - {n: "4", title: "You get a clear answer", body: "With the detail it found, or an honest 'not in your records'."}
    - {n: "5", title: "Follow up by phone", body: "Anything that changes an appointment is arranged with the clinic."}
  verification_note: >-
    Anything specific to you - visits, treatments, invoices - requires signing in with your codice
    fiscale and the PIN the clinic issues you. The assistant will not discuss a patient's records
    with anyone who has not verified their identity.
  preview:
    label: "Preview - not a live conversation"
    turns:
      - {who: "patient", text: "When was my last cleaning?"}
      - {who: "assistant", text: "Your most recent hygiene appointment was on 12 August 2026."}
      - {who: "patient", text: "And what do I still owe?"}
      - {who: "assistant", text: "There is one open invoice of € 90,00 from that visit."}
    voice_note: "Voice is not available yet."
    cta_label: "Open the assistant"

