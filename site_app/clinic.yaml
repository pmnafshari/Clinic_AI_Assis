    body: "Available 24/7"

booking:
  heading: "Need an appointment?"
  body: >-
    Tell us whether you have been here before and we will point you the right way.
  # There IS a booking system now (phase 41 staff, phase 42 patient portal) -
  # but not on the PUBLIC site, which has no database connection at all. Every
  # path below is a real destination - a phone number or the assistant login -
  # and none of them confirms an appointment on this page. The note below stays
  # true either way: arranging one through the assistant is exactly what a
  # signed-in patient now does.
  note: >-
    Appointments are arranged by phone or through the assistant. Nothing is confirmed on this page.
  options:
    - {label: "I am a new patient", body: "Call us and we will find a first appointment that suits you."}
    - {label: "I am already a patient", body: "Sign in to the assistant to ask about your next visit."}

