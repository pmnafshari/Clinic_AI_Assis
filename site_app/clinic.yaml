faq:
  heading: "Common questions"
  entries:
    - q: "How do I book an appointment?"
      a: "By phone, or by asking the assistant and then confirming with reception. Appointments are not booked on this website."
    - q: "Can I reschedule or cancel?"
      a: "Yes - call the clinic. Changes to an appointment are made by reception, not by the assistant."
    - q: "Do I need an account?"
      a: "Not to browse this site. To ask about your own records you sign in with your codice fiscale and a PIN the clinic issues you."
    - q: "How does patient verification work?"
      a: "Your PIN is issued by the clinic and changed on first use. Until you have signed in, the assistant answers only general questions about the clinic."
    - q: "Can the assistant see my records?"
      a: "Only your own, and only once you have signed in. If something is not in your records it says so rather than guessing."
    - q: "How do I get my invoices?"
      a: "Ask the assistant once you are signed in, or ask administration at the clinic."

