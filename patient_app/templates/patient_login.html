{% extends "patient_base.html" %}
{% block content %}
<h1 class="mb-3">{{ t('login_heading', lang) }}</h1>
<p class="text-secondary mb-4">{{ t('login_body', lang) }}</p>
<form method="post" action="{{ url_for('patient.login') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label for="codice_fiscale" class="form-label">{{ t('cf_label', lang) }}</label>
    <input type="text" id="codice_fiscale" name="codice_fiscale" class="form-control" autofocus required>
  </div>
  <div class="mb-4">
    <label for="pin" class="form-label">{{ t('pin_label', lang) }}</label>
    <input type="password" id="pin" name="pin" class="form-control" inputmode="numeric" required>
  </div>
  <button type="submit" class="btn btn-primary w-100">{{ t('login_cta', lang) }}</button>
</form>
{% endblock %}
