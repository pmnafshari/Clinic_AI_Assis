{% extends "base.html" %}
{% block content %}
<h1 class="page-title">Staff accounts</h1>

<div class="card p-4">
  <div class="table-responsive">
  <table class="table align-middle mb-0">
    <thead>
      <tr>
        <th scope="col">Username</th>
        <th scope="col">Role</th>
        <th scope="col">Status</th>
        <th scope="col"><span class="visually-hidden">Actions</span></th>
      </tr>
    </thead>
    <tbody>
      {% for row in rows %}
      {% include "_user_row.html" %}
      {% endfor %}
    </tbody>
  </table>
  </div>
</div>

<div class="card p-4 mt-6">
  <h2 class="section-title">Add a staff account</h2>
  <form method="post" action="{{ url_for('admin.create') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="d-flex flex-column gap-3">
      <div>
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" name="username" class="form-control" required>
      </div>
      <div>
        <label for="role" class="form-label">Role</label>
        <select id="role" name="role" class="form-select">
          <option value="dentist">dentist</option>
          <option value="assistant">assistant</option>
          <option value="admin">admin</option>
        </select>
      </div>
      <div>
        <label for="password" class="form-label">Initial password</label>
        <input type="password" id="password" name="password" class="form-control" required>
      </div>
      <div>
        <button type="submit" class="btn btn-primary">Create account</button>
      </div>
    </div>
  </form>
</div>

<div class="modal fade" id="admin-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content" id="admin-modal-body"></div>
  </div>
</div>

<div id="admin-toast-container" class="toast-container position-fixed top-0 end-0 p-3"></div>
{% endblock %}
