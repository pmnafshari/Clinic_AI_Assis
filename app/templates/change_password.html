{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 100vh;">
  <div class="card p-4" style="width: 100%; max-width: 360px;">
    <h1 class="fs-4 mb-2"><i class="bi bi-shield-lock"></i> Set a new password</h1>
    <p class="text-secondary">Your account was created with a temporary password. Choose a new one to continue.</p>
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="post" action="{{ url_for('auth.change_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label for="password" class="form-label">New password</label>
        <input type="password" id="password" name="password" class="form-control" autofocus>
      </div>
      <div class="mb-3">
        <label for="confirm" class="form-label">Confirm password</label>
        <input type="password" id="confirm" name="confirm" class="form-control">
      </div>
      <button type="submit" class="btn btn-primary w-100">Set password</button>
    </form>
  </div>
</div>
{% endblock %}
