{% if files %}
<ul class="ds-rows">
  {% for f in files %}
  <li class="ds-row">
    <span class="ds-kpi-icon ds-row-lead" aria-hidden="true"><i class="bi bi-file-earmark"></i></span>
    <span class="ds-row-main"><span class="ds-row-title">{{ f }}</span></span>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="text-secondary mb-0">No files on record.</p>
{% endif %}
