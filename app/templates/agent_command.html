{% extends "base.html" %}
{% block content %}
{# "Run a command" is asserted verbatim by admin_routes_selftest (SC5) #}
<h1 class="page-title">Run a command</h1>
<div class="ds-card">
  <div class="ds-card-body">
    {% if error %}
    <div class="ds-alert ds-alert-danger" role="alert">{{ error }}</div>
    {% endif %}
    <form method="post" action="{{ url_for('agent.command_page') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="ds-field">
        <label for="command" class="ds-label">Command</label>
        <textarea id="command" name="command" rows="4" class="ds-textarea" autofocus>{{ command or '' }}</textarea>
        <p class="ds-help">Nothing is written until you confirm the change on the next screen.</p>
      </div>
      <button type="submit" class="ds-btn ds-btn-primary">Run command</button>
    </form>
  </div>
</div>
{% endblock %}
