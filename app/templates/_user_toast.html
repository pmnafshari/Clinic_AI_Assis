{# no .badge on the icon: bootstrap hides .badge:empty and the glyph is a ::before #}
{% if ok %}
<div class="toast" role="status" data-bs-autohide="true" data-bs-delay="6000">
  <div class="toast-header">
    <i class="bi bi-check-circle-fill text-primary me-2"></i>
    <strong class="me-auto">{{ username }} updated.</strong>
    <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
  </div>
  <div class="toast-body">{{ message }}</div>
</div>
{% else %}
<div class="toast" role="alert" data-bs-autohide="false">
  <div class="toast-header">
    <i class="bi bi-x-circle-fill text-danger me-2"></i>
    <strong class="me-auto">{{ username }}</strong>
    <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
  </div>
  <div class="toast-body">{{ message }}</div>
</div>
{% endif %}
